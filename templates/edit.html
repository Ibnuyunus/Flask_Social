<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Edit</title>
    <!-- <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}"> -->
    <link rel="stylesheet" href="{{ url_for('static', filename='edit.css') }}">
</head>
<body class="post-edit-page">
	<label>Current File:</label>
        {% if edit.upload %}
            {{ edit.upload }}
        {% else %}
            No file uploaded
        {% endif %}

        <br><br>
	<form method="POST" enctype="multipart/form-data">
		<label>Post Title</label>
		<input type="text" name="title" value="{{edit.title}}">
		<label>Post Desription</label>
		<input type="text" name="description" value="{{edit.description}}">
		<label>Upload New File</label> <br><br>
        <input type="file" name="post_image">
		<input type="submit" value="Update"><br><br>
		<a href="{{ url_for('home') }}" class="logout-btn">Go Home</a>
	</form>


</body>
</html>
